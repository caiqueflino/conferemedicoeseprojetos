*,*::before,*::after{box-sizing:border-box}

::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:4px}

.bg-grid{background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px}
.bg-radial-emerald{background:radial-gradient(ellipse 75% 60% at 30% 15%,rgba(0,191,98,0.16),transparent)}

.glass{background:var(--glass);border:1px solid var(--border-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}

.glow-emerald{box-shadow:0 0 0 1px rgba(16,185,129,0.4),0 0 32px -4px var(--emerald-soft)}
.glow-emerald-lg{box-shadow:0 0 60px -10px var(--emerald-soft)}

.font-display{font-family:var(--font-display)}
.font-mono{font-family:var(--mono)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseDot{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 7px rgba(16,185,129,0)}}
@keyframes floatSlow{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

.animate-fadeUp{animation:fadeUp .7s ease both}
.animate-float{animation:floatSlow 5s ease-in-out infinite}

.cursor-blink{animation:blink 1s step-end infinite}

.card-hover{transition:transform .35s cubic-bezier(.16,1,.3,1),border-color .35s,box-shadow .35s}

// ── Scroll reveal hook ─────────────────────────────────────────────────────
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal");
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) e.target.classList.add("in");
      });
    }, {
      threshold: 0.15
    });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}
